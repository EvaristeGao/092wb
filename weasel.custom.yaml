# Weasel settings
# encoding: utf-8
# 来源 https://github.com/iDvel/rime-ice/blob/main/weasel.yaml
# 感谢 @[Mirtle](https://github.com/mirtlecn) 整理
# Rime 定制指南 <https://github.com/rime/home/wiki/CustomizationGuide#定製指南>
# Weasel 定制文档 <https://github.com/rime/weasel/wiki/Weasel-定制化>
# Weasel 字体设定 <https://github.com/rime/weasel/wiki/字體設定>

# 部分选项需要将 Weasel 更新至最新开发版才能生效
config_version: "2024.06.02"

patch:
  "preset_color_schemes/+":
    nord_dark:                                   # 在 `style/color_schema` 指定的配色方案值
      name: "极夜／Nord Dark"                  # 方案设置中显示的配色名称
      author: Mirtle                           # 配色作者名称
      color_format: rgba                       # 颜色格式：argb；rgba；abgr

      # 默认配色
      text_color: 0xD8DEE9                     # 文字：Snow Storm 暗白（原 0x2E3440 的暗色对应）
      shadow_color: 0x000000b4                 # 阴影：保持半透明黑
      label_color: 0x81A1C1                    # 标签：Frost 蓝（在暗底上替代原 0x4C566A）
      comment_text_color: 0xD08770              # 注释：Aurora 橙（保留）
      border_color: 0x4C566A                   # 边框：Polar Night 浅灰（暗色边框线）
      back_color: 0x2E3440                     # 背景：Polar Night 最深（原 0xECEFF4 的暗色对应）

      # 普通候选项配色
      candidate_back_color: 0x2E3440            # 背景：与面板统一
      candidate_text_color: 0xD8DEE9            # 文字：Snow Storm 暗白

      # 编码区域配色
      hilited_text_color: 0x2E3440              # 文字：Polar Night 最深（黄底上的深色字，对比度足够）
      hilited_back_color: 0xEBCB8B              # 背景：Aurora 黄（保留亮色高亮，暗底上更醒目）
      # hilited_shadow_color:                   # 阴影

      # 选中的候选区域配色
      hilited_mark_color: 0xBF616A              # 标记：Aurora 红（保留）
      hilited_label_color: 0x4C566A             # 标签：Polar Night 浅灰（在青绿底 0x8FBCBB 上清晰可读）
      hilited_comment_text_color: 0xBF616A      # 注释：Aurora 红（保留）
      hilited_candidate_text_color: 0x2E3440    # 文字：Polar Night 最深（青绿底上的深色字）
      hilited_candidate_border_color: 0x8FBCBB  # 边框：Frost 青绿（保留）
      hilited_candidate_back_color: 0x8FBCBB    # 背景：Frost 青绿（保留，暗色面板下作为高亮色块非常突出）
      # hilited_candidate_shadow_color:         # 阴影

      # inline_preedit: false 时翻页箭头颜色，不设置则不显示箭头
      # nextpage_color: 0xD8DEE9                # 下一页：如需要可开启
      # prevpage_color: 0xD8DEE9                # 上一页：如需要可开启
  style:
    antialias_mode: default
    ascii_tip_follow_cursor: false
    candidate_abbreviate_length: 30
    click_to_capture: false
    color_scheme: nord
    color_scheme_dark: nord_dark
    comment_font_face: "NotFont, Noto Color Emoji SVG:80,LXGW Wenkai GB Screen, 092etymon, Segoe UI Emoji:80, Microsoft Yahei, 全宋体-1, 全宋体-2, 全宋体-3, 全宋体-F, 全宋体-X, 全宋体(调和), 全宋体(等宽)"
    comment_font_point: 12
    display_tray_icon: false
    enhanced_position: true
    font_face: "NotFont, Noto Color Emoji SVG:1f1e0:1f1ff, Segoe UI Emoji:80, LXGW Wenkai GB Screen, Microsoft Yahei, TH-Times, TH-tshyn-P0, TH-tshyn-P1, TH-tshyn-P2, TH-tshyn-P16, 全宋体-1, 全宋体-2, 全宋体-3, 全宋体-F, 全宋体-X, 全宋体(调和), 全宋体(等宽), 宋体, SimSun, SimSun-ExtB, SimSun-ExtG"
    font_point: 14
    fullscreen: false
    horizontal: false
    inline_preedit: false
    label_font_face: "Microsoft YaHei"
    label_font_point: 14
    label_format: "%s. "
    layout:
      align_type: center
      border_width: 1
      candidate_spacing: 2
      corner_radius: 4
      hilite_padding: 2
      hilite_padding_x: 2
      hilite_padding_y: 2
      hilite_spacing: 2
      hilited_corner_radius: 4
      margin_x: 10
      margin_y: 10
      max_height: 600
      max_width: 0
      min_height: 0
      min_width: 0
      shadow_offset_x: 4
      shadow_offset_y: 12
      shadow_radius: 8
      spacing: 2
    mark_text: ""
    mouse_hover_ms: 0
    paging_on_scroll: true
    preedit_type: composition
    vertical_auto_reverse: false
    vertical_text: false
    vertical_text_left_to_right: false
    vertical_text_with_wrap: false
